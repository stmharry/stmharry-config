[project]
name = "stmharry-config"
description = "Personal system and application configuration."
supported_hosts = ["Ubuntu 24.04", "macOS"]

[policy]
state_model = "declarative"
mutation_boundary = "explicit apply; agent executes approved setup recipes"
version_policy = "stable tools; latest AI CLIs; locked editor plugins"
host_variation = "host detection and untracked local overrides"

[package_managers.apt]
command = "apt"
platforms = ["Linux"]

[package_managers.brew]
command = "brew"
platforms = ["Darwin"]
setup = { Darwin = [
  "bash -c \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)\"",
] }
verify = ["brew --version"]
docs = "https://brew.sh/"
notes = "Bootstrap Homebrew before its package recipes; follow the installer's shellenv instructions."

# Entries are ordered: execute only approved, missing required setup steps.
# setup/verify are display-only shell instructions, never executed by cli.py.

[[tools]]
id = "python"
command = "python3"
channel = "stable"
required = true
min_version = "3.11"
version_args = ["--version"]
verify = ["python3 --version"]
setup = { Linux = [
  "sudo apt update",
  "sudo apt install python3 python3-venv",
], Darwin = [
  "brew install python",
] }

[[tools]]
id = "git"
command = "git"
channel = "stable"
required = true
verify = ["git --version"]
setup = { Linux = [
  "sudo apt install git",
], Darwin = [
  "brew install git",
] }

[[tools]]
id = "curl"
command = "curl"
channel = "stable"
required = true
verify = ["curl --version"]
setup = { Linux = [
  "sudo apt install curl ca-certificates",
