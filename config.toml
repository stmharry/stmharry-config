  "nvim --headless '+Lazy! restore' +qa",
], Darwin = [
  "nvim --headless '+Lazy! restore' +qa",
] }
verify = ["nvim --headless '+lua assert(require(\"lazy.core.config\").plugins.AstroNvim)' +qa"]
docs = "https://docs.astronvim.com/"
notes = "After restore, run :checkhealth and verify Mason installs pyright, lua_ls, ruff, stylua, debugpy and tree-sitter-cli. Nerd Fonts belong on the terminal client, including for SSH."

