[[tools]]
id = "node"
command = "node"
channel = "lts"
required = true
min_version = "22"
version_args = ["--version"]
docs = "https://github.com/nvm-sh/nvm#installing-and-updating"
notes = "Run the recipe in bash or zsh. Reload the login shell to make the default Node visible to agents."
verify = ["node --version"]
setup = { Linux = [
  "mkdir -p \"$HOME/.nvm\"",
  "curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | env PROFILE=/dev/null NVM_DIR=\"$HOME/.nvm\" bash",
  "export NVM_DIR=\"$HOME/.nvm\"; . \"$NVM_DIR/nvm.sh\"; nvm install --lts; nvm alias default \"lts/*\"; nvm use default",
], Darwin = [
  "mkdir -p \"$HOME/.nvm\"",
  "curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.8/install.sh | env PROFILE=/dev/null NVM_DIR=\"$HOME/.nvm\" bash",
  "export NVM_DIR=\"$HOME/.nvm\"; . \"$NVM_DIR/nvm.sh\"; nvm install --lts; nvm alias default \"lts/*\"; nvm use default",
] }

