[[tools]]
id = "neovim"
command = "nvim"
channel = "stable"
required = true
min_version = "0.11"
version_args = ["--version"]
docs = "https://github.com/neovim/neovim/blob/master/INSTALL.md"
notes = "Ubuntu 24.04 apt neovim is too old for AstroNvim v6. Use a stable upstream release; never overwrite an existing local install without reviewing a backup."
verify = ["nvim --version"]
setup = { Linux = [
  '''
set -eu
case "$(uname -m)" in x86_64) nvim_arch=x86_64 ;; aarch64|arm64) nvim_arch=arm64 ;; *) echo "Unsupported Neovim architecture" >&2; exit 1 ;; esac
nvim_tmp="$(mktemp -d)"
curl -fL "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-${nvim_arch}.tar.gz" -o "$nvim_tmp/nvim.tar.gz"
mkdir -p "$HOME/.local/opt" "$HOME/.local/bin"
# Refuse to replace an existing install; review and back it up first.
test ! -e "$HOME/.local/opt/nvim-linux-${nvim_arch}"
test ! -e "$HOME/.local/bin/nvim" && test ! -L "$HOME/.local/bin/nvim"
tar -xzf "$nvim_tmp/nvim.tar.gz" -C "$HOME/.local/opt"
ln -s "$HOME/.local/opt/nvim-linux-${nvim_arch}/bin/nvim" "$HOME/.local/bin/nvim"
rm -rf "$nvim_tmp"
''',
], Darwin = [
  "brew install neovim",
] }

