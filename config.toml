] }
verify = ["test -x \"$HOME/.tmux/plugins/tpm/tpm\""]
docs = "https://github.com/tmux-plugins/tpm"

[[prerequisites]]
id = "catppuccin"
path = "~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux"
kind = "file"
group = "core"
required = true
phase = "before-apply"
setup = { Linux = [
  "mkdir -p \"$HOME/.config/tmux/plugins/catppuccin\"",
  "git clone --depth 1 --branch v2.3.1 https://github.com/catppuccin/tmux.git \"$HOME/.config/tmux/plugins/catppuccin/tmux\"",
], Darwin = [
  "mkdir -p \"$HOME/.config/tmux/plugins/catppuccin\"",
  "git clone --depth 1 --branch v2.3.1 https://github.com/catppuccin/tmux.git \"$HOME/.config/tmux/plugins/catppuccin/tmux\"",
] }
verify = ["test -f \"$HOME/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux\""]
docs = "https://github.com/catppuccin/tmux#installation"
notes = "Pinned theme installed manually; TPM manages the other tmux plugins."

[[prerequisites]]
id = "tmux-cpu"
path = "~/.tmux/plugins/tmux-cpu/cpu.tmux"
kind = "file"
group = "core"
required = true
phase = "after-apply"
setup = { Linux = [
  '''
set -eu
tmux_setup_dir="$(mktemp -d)"
trap 'tmux -S "$tmux_setup_dir/socket" kill-server 2>/dev/null || true; rm -rf "$tmux_setup_dir"' EXIT
tmux -S "$tmux_setup_dir/socket" -f "$HOME/.config/tmux/tmux.conf" new-session -d -s setup
TMUX="$tmux_setup_dir/socket,0,0" "$HOME/.tmux/plugins/tpm/bin/install_plugins"
''',
], Darwin = [
  '''
set -eu
tmux_setup_dir="$(mktemp -d)"
trap 'tmux -S "$tmux_setup_dir/socket" kill-server 2>/dev/null || true; rm -rf "$tmux_setup_dir"' EXIT
tmux -S "$tmux_setup_dir/socket" -f "$HOME/.config/tmux/tmux.conf" new-session -d -s setup
TMUX="$tmux_setup_dir/socket,0,0" "$HOME/.tmux/plugins/tpm/bin/install_plugins"
''',
] }
verify = ["test -f \"$HOME/.tmux/plugins/tmux-cpu/cpu.tmux\""]
notes = "Run against the managed configuration in a new isolated tmux server; do not reload existing user sessions without approval."

[[prerequisites]]
id = "lazy-nvim"
path = "~/.local/share/nvim/lazy/lazy.nvim/lua/lazy/init.lua"
kind = "file"
group = "core"
required = true
phase = "after-apply"
setup = { Linux = [
  "nvim --headless '+Lazy! restore' +qa",
], Darwin = [
  "nvim --headless '+Lazy! restore' +qa",
] }
verify = ["test -f \"$HOME/.local/share/nvim/lazy/lazy.nvim/lua/lazy/init.lua\""]
docs = "https://lazy.folke.io/usage"
notes = "Restore the committed plugin lock; do not run Lazy update during routine setup."

[[prerequisites]]
id = "astronvim"
path = "~/.local/share/nvim/lazy/AstroNvim/lua/astronvim/init.lua"
kind = "file"
group = "core"
required = true
phase = "after-apply"
