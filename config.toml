required = true
notes = "macOS developer tools installation may require a GUI confirmation; verify before continuing."
verify = ["cc --version"]
setup = { Linux = [
  "sudo apt install build-essential",
], Darwin = [
  "xcode-select --install",
] }

[[tools]]
id = "make"
command = "make"
channel = "stable"
